<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>Tacoma World — 2019 TRD Sport</title>
  <meta name="description" content="Maintenance schedule, torque specs, part numbers and an AI mechanic for a 2019 Toyota Tacoma TRD Sport.">

  <!-- PWA install metadata -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#111111">

  <!-- iOS: install to home screen, run fullscreen -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tacoma">
  <link rel="apple-touch-icon" href="/assets/icons/icon-180.png">
  <link rel="apple-touch-startup-image" href="/assets/icons/splash.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/icons/icon-192.png">

  <link rel="stylesheet" href="/assets/css/tacoma-world.css">

  <!-- React is served from this origin so the app works with no network.
       Do not switch these back to a CDN — that breaks the offline contract. -->
  <script src="/assets/js/react.min.js"></script>
  <script src="/assets/js/react-dom.min.js"></script>
</head>
<body>
<div id="root"></div>

<!-- Built from src/app.jsx by `npm run build`. Do not edit this file directly. -->
<script src="/assets/js/app.js"></script>

<script>
  if ("serviceWorker" in navigator) {
    // When a new version takes over, reload once so it actually shows. Skipped on the
    // very first visit (no previous controller), so first install never reloads.
    var hadController = !!navigator.serviceWorker.controller, reloading = false;
    navigator.serviceWorker.addEventListener("controllerchange", function () {
      if (!hadController || reloading) return;
      reloading = true;
      window.location.reload();
    });
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("/service-worker.js").catch(function (e) {
        console.warn("Service worker registration failed:", e);
      });
    });
  }
</script>
</body>
</html>
